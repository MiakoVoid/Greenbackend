spring:
  datasource:
    url: jdbc:mysql://localhost:3306/greenfinance?characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource

    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20

logging:
  level:
    root: debug
    com.it.greenfinance: debug
    # 减少RMI相关调试日志
    sun.rmi: INFO
    javax.management: INFO

jwt:
  secret: dev-secret-key

crypto:
  secret: dev-crypto-secret

ai:
  model-enabled: true
  model-api-url: https://api-inference.modelscope.cn/v1/chat/completions
  model-api-key: ms-bfcc689c-652f-4df4-b26b-a9dfaf846b85
  ocr-enabled: true
  advice-enabled: true