spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource

    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true

logging:
  level:
    root: info
    com.it.greenfinance: info
    # 减少RMI相关调试日志
    sun.rmi: WARN
    javax.management: WARN

jwt:
  secret: ${JWT_SECRET}

crypto:
  secret: ${CRYPTO_SECRET}

ai:
  model-enabled: ${AI_MODEL_ENABLED:true}
  model-api-url: ${AI_MODEL_API_URL}
  model-api-key: ${AI_API_KEY}
  model-id: ${AI_MODEL_ID:Qwen/Qwen3-4B}
  stream-enabled: ${AI_STREAM_ENABLED:true}
  ocr-enabled: ${AI_OCR_ENABLED:true}
  advice-enabled: ${AI_ADVICE_ENABLED:true}
