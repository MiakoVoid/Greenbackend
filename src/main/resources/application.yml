server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - classpath:product-config.yml
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # 序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
jwt:
  expiration: 604800000 # 7 天
  ignore-paths:
    /auth/register,
    /auth/login,
    /swagger-ui/**,
    /v3/api-docs/**,
    /error,
    /favicon.ico,
    /actuator/health,
    /css/**,
    /js/**,
    /images/**,
    /webjars/**,
    /uploads/**,
    /websocket-test.html,
    /ws/**,
    /sockjs/**,
    /ws-test/**

# 日志配置
logging:
  level:
    # 减少 RMI 相关调试日志
    sun.rmi: INFO
    javax.management: INFO
    # MyBatis 日志保持 DEBUG 级别以便 SQL 调试
    com.it.greenfinance.mapper: DEBUG
    # 减少 Tomcat 和 Spring 的 DEBUG 日志
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    org.springframework.web: INFO
    # 减少 Tomcat WebSocket 相关 DEBUG 日志
    org.apache.coyote.http11: WARN
    org.apache.tomcat.util.net: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

mybatis-plus:
  global-config:
    db-config:
      #id类型: 自增
      id-type: auto
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  type-aliases-package: com.it.greenfinance.pojo
  mapper-locations: classpath:com/it/greenfinance/mapper/xml/*.xml
